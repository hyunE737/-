<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f4f0e7"><title>터치 점검 · 누리 키우기</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:#f4f0e7;color:#284640;font:16px/1.65 system-ui,-apple-system,sans-serif;display:grid;place-items:center;padding:20px}main{width:min(100%,430px);padding:24px;border:1px solid #d5ded3;border-radius:25px;background:#fffdf7;box-shadow:0 8px 0 #dce4d9}h1{margin:0 0 8px;font-size:26px}p{color:#697d76}button,a{display:block;width:100%;min-height:54px;margin:12px 0;padding:14px;background:#285f59;color:#fffdf7;border:0;border-radius:14px;text-align:center;font:inherit;font-weight:800;text-decoration:none;touch-action:manipulation}#result{padding:13px;border:1px solid #c9dacf;border-radius:12px;background:#e8f3eb;min-height:90px}small{color:#688278}</style></head><body><main><small>NURI LIFE · v1.0.0</small><h1>모바일 터치 확인</h1><p>버튼을 눌러 작동 여부를 테스트할 수 있어. 게임 저장 데이터는 변경되지 않아.</p><div id="result">테스트를 준비 중이야.</div><button type="button" id="test">터치 테스트하기</button><button type="button" id="reset">테스트 초기화</button><a href="/">게임으로 돌아가기</a></main><script>(function(){const el=document.getElementById('result');let n=0;el.textContent='스크립트 준비 완료. 아래 버튼을 눌러 줘.';document.getElementById('test').addEventListener('click',()=>{n++;el.textContent='버튼 작동 성공! '+n+'회';});document.getElementById('reset').addEventListener('click',()=>{n=0;el.textContent='초기화 완료';});})();</script></body></html>
